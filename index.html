<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickNotes</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header>
      <h1>QuickNotes</h1>
      <p>Capture ideas before they disappear.</p>
    </header>

    <main>
      <section aria-labelledby="add-note-heading">
        <h2 id="add-note-heading">Add a note</h2>

        <form id="note-form">
          <div>
            <label for="note-input">Note</label>
            <input
              type="text"
              id="note-input"
              name="note"
              placeholder="Type your note..."
            />
          </div>

          <div>
            <label for="note-category">Category</label>
            <select id="note-category" name="category">
              <option value="personal">Personal</option>
              <option value="work">Work</option>
              <option value="study">Study</option>
            </select>
          </div>

          <button type="submit">Add Note</button>
        </form>

        <p id="error-message" role="alert"></p>
      </section>

      <section aria-labelledby="your-notes-heading">
        <h2 id="your-notes-heading">Your notes</h2>

        <label for="search-input">Search notes</label>
        <input
          type="search"
          id="search-input"
          placeholder="Search your notes..."
        />

        <p id="note-count">You have no notes yet.</p>

        <ul id="notes-list"></ul>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 QuickNotes. Built during Web Foundations.</p>
    </footer>
  </body>
</html>
